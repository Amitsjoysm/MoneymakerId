# MarketMind AI: local Supabase stack.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# Security layout (docs/CONTRACTS.md section 5):
#   - schema `app`        holds every table and is NEVER exposed through the API
#   - schema `api`        public SECURITY DEFINER functions (publishable key)
#   - schema `admin_api`  service-role-only functions (secret key)
# The site does not use Supabase Auth, Realtime, Studio or Edge Functions, so they are
# switched off locally to keep `supabase start` small and fast.

project_id = "marketmind-ai"

[api]
enabled = true
port = 54321
# Only `api` and `admin_api` are exposed. `public` and `app` are deliberately absent.
schemas = ["api", "admin_api"]
extra_search_path = ["extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Must match the hosted project. Supabase CLI 2.x defaults to Postgres 17.
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true
# Files are `supabase/migrations/<digits>_<name>.sql`. T02a uses 00NN_, T02b 01NN_ and
# T02c 02NN_, so they sort numerically in that order.
schema_paths = []

[db.seed]
# Reference data is loaded by `mm import:reference`, never by a seed file.
enabled = false

[db.network_restrictions]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = false
site_url = "http://127.0.0.1:3000"

[edge_runtime]
enabled = false

[analytics]
enabled = false
